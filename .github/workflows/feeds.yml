name: Update Famitsu feeds

on:
  schedule:
    - cron: "23 * * * *" # hourly; GitHub often starts scheduled runs a few minutes late
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build feeds
        run: python3 famitsu_rss.py --out site --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Keep the schedule alive
        # GitHub turns off scheduled workflows after 60 days without repository activity.
        run: |
          if [ "$(git log -1 --format=%ct)" -lt "$(date -d '30 days ago' +%s)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled feed updates running"
            git push
          fi
