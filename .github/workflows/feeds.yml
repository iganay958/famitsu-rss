name: Update Famitsu feeds

on:
  schedule:
    # GitHub skips many scheduled runs under load, so ask often to get a run every hour or two.
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build feeds
        id: build
        run: python3 famitsu_rss.py --out site --base-url "${{ steps.pages.outputs.base_url }}"

      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        if: steps.build.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # deploy-pages sometimes cannot see the artifact uploaded a moment earlier
      # ("No artifacts named github-pages were found"); a retry a minute later clears it.
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Keep the schedule alive
        # GitHub turns off scheduled workflows after 60 days without repository activity.
        run: |
          if [ "$(git log -1 --format=%ct)" -lt "$(date -d '30 days ago' +%s)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled feed updates running"
            git push
          fi
